syntax = "proto3";

package ax_proto_msgs;

import "header.proto";

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

// 图像平面上的有向包围盒（OBB）：中心 + 未旋转边长 + 旋转角。
// center_x / center_y 为框中心在图像坐标系中的位置，width / height 为未旋转时
// 沿图像 x / y 轴的边长，单位与坐标系由 header.frame_id 指定（通常为像素）。
message Detection2D {
    uint64 id = 1;         // 目标标识，无跨帧跟踪时可为 0
    uint32 class_id = 2;   // 类别编号，含义由 Detection2DArray.class_schema 指定的类别表定义
    string class_name = 3; // 可选，便于日志与跨系统调试
    float  score = 4;

    float center_x = 5;
    float center_y = 6;
    float width = 7;
    float height = 8;

    // 框绕自身中心的旋转角（弧度），正方向由坐标系手性约定（见 header.frame_id）。
    float rotation_rad = 9;
}

message Detection2DArray {
    Header header = 1;
    // 标识 class_id 所属的类别表，例如 "warehouse_v2"；空表示由 topic 约定。
    string class_schema = 2;
    repeated Detection2D detections = 3;
}
