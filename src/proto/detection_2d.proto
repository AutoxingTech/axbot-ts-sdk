syntax = "proto3";

package ax_proto_msgs;

import "header.proto";

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

// 二维地图上的线速度，沿 Detection2DArray.header.frame_id 的 x / y 轴，单位 m/s。
message Velocity2D {
    float x = 1;
    float y = 2;
}

// 预测轨迹上的一个点。
// x / y 为点在地图上的位置，与 Detection2D.center_x / center_y 同一坐标系
// （即 Detection2DArray.header.frame_id），单位米。
message PredictionPoint2D {
    float x = 1;
    float y = 2;
    // 此预测点处包围盒的朝向，与 Detection2D.rotation_rad 同一约定，单位弧度。
    float ori = 3;
    // 相对 Detection2DArray.header.stamp_nsec 的毫秒偏移，非负。
    uint32 dt_ms = 4;
}

// 二维地图上的有向包围盒（OBB）：中心 + 未旋转边长 + 旋转角。
// center_x / center_y 为框中心在 Detection2DArray.header.frame_id 坐标系中的位置，
// width / height 为沿框自身轴的边长，单位均为米。
message Detection2D {
    uint64 id = 1;         // 目标标识，无跨帧跟踪时可为 0
    uint32 class_id = 2;   // 类别编号，含义由 Detection2DArray.class_schema 指定的类别表定义
    string class_name = 3; // 可选，便于日志与跨系统调试
    float  score = 4;

    float center_x = 5;
    float center_y = 6;
    float width = 7;
    float height = 8;

    // 框绕自身中心的旋转角（弧度），正方向由 Detection2DArray.header.frame_id 的坐标系手性约定。
    float rotation_rad = 9;

    // Detection2DArray.header.stamp_nsec 时刻估计的线速度；未提供速度时不设置此字段。
    // 运动方向由速度向量给出，可能与包围盒的旋转角不同。
    Velocity2D velocity = 10;

    // 预测轨迹，按 PredictionPoint2D.dt_ms 升序；首点 dt_ms 为 0 且通常等于框中心。
    // 首点 ori 通常等于 rotation_rad，后续点给出各预测时刻的朝向。
    // 一条 Detection2D 至多一条预测（不区分多模态分支），空表示未提供预测。
    // 提供预测时，velocity 应与其首点处的速度一致。
    repeated PredictionPoint2D prediction = 11;
}

message Detection2DArray {
    Header header = 1;
    // 标识 class_id 所属的类别表，例如 "warehouse_v2"；空表示由 topic 约定。
    string class_schema = 2;
    repeated Detection2D detections = 3;
}
