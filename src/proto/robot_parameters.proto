syntax = "proto3";
package ax_proto_msgs;
option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

message ParameterValue {
    string name = 1;

    // The value type is the case that is set; senders must set exactly one of them.
    oneof value {
        bool bool_value = 2;
        sint64 int_value = 3;
        float float_value = 4;
    }
}
message InstanceRobotParameters {
    string instance_id = 1;
    uint64 stamp_nsec = 2;
    uint64 valid_for_nsec = 3;
    repeated ParameterValue parameters = 4;
}
message RobotParameters {
    string source_id = 1;
    repeated InstanceRobotParameters instances = 2;
}