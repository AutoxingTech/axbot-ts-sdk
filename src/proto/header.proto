syntax = "proto3";

package ax_proto_msgs;

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

// Header message matching ROS std_msgs/Header
message Header {
    uint32 seq = 1;
    reserved 2;             // was stamp_sec, merged into stamp_nsec
    uint64 stamp_nsec = 3;  // full nanosecond timestamp since epoch
    string frame_id = 4;
}
