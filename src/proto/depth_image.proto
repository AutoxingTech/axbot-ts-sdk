syntax = "proto3";

package ros_messages;

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

message DepthImage {
    message Encoding {
        enum Type {
            UNKNOWN          = 0;
            PNG_INDEXED_8    = 1;
        }
    }

    int32          width       = 1;
    int32          height      = 2;
    Encoding.Type  encoding    = 3;
    bytes          image_data  = 4;  // encoded image data per encoding type
}
