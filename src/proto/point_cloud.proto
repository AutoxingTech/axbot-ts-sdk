syntax = "proto3";

package ax_proto_msgs;

import "header.proto";

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

// Simplified PointCloud message
// Points are stored as offsets from center (in resolution units)
// Actual position = center + (xs[i] * resolution, ys[i] * resolution, zs[i] * resolution)
message PointCloud {
    Header header = 1;
    uint32 point_number = 2;
    double center_x = 3;
    double center_y = 4;
    double center_z = 5;
    float resolution = 6;           // meters per unit
    repeated sint32 xs = 7 [packed=true];  // x offsets (sint32 for negative values, zigzag encoded)
    repeated sint32 ys = 8 [packed=true];  // y offsets
    repeated sint32 zs = 9 [packed=true];  // z offsets (optional, can be empty for 2D)
    bytes intensities = 10;         // intensity values 0-255, one byte per point
    bool is_delta_encoded = 11;     // if true, xs, ys, zs are delta encoded (each value is relative to the previous point)
    bytes probabilities = 12;       // probability values 0-255, one byte per point
    bytes oris = 13;                // orientation values 0-255, one byte per point
    bytes speeds = 14;              // speed values 0-255, one byte per point
}

// Raw LiDAR points that keep their acquisition timing, for cases where PointCloud's
// quantized coordinates and single cloud-level stamp are not enough.
//
// Each pack has an absolute base timestamp and per-point acquisition offsets.
// A pack is one firing group of the device; its size is not fixed.
// Omit missing returns and empty packs; do not emit an empty cloud.
message RawPointCloud {
    // stamp_nsec is the acquisition time of the first point, i.e. packs[0].stamp_nsec.
    Header header = 1;
    uint32 point_number = 2;              // total points over all packs
    repeated RawPointCloudPack packs = 3; // in acquisition order
}

message RawPointCloudPack {
    // Absolute acquisition time of this pack's first point, full epoch nanoseconds
    // (same domain as Header.stamp_nsec).
    uint64 stamp_nsec = 1;

    // Meters in header.frame_id at each point's acquisition time; not deskewed.
    // xs, ys, zs and dt_nsec must have equal lengths.
    repeated float xs = 2 [packed=true];
    repeated float ys = 3 [packed=true];
    repeated float zs = 4 [packed=true];

    // Nanoseconds after stamp_nsec; starts at zero and is nondecreasing.
    repeated uint32 dt_nsec = 5 [packed=true];

    bytes intensities = 6;                // 0-255, one byte per point
}
