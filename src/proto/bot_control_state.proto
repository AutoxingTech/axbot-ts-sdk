syntax = "proto3";

package ax_proto_msgs;

option go_package = "webrtc_client/proto";
option optimize_for = SPEED;

message BotControlState
{
    int32 action_id = 1;  // 当前正在执行的任务 id
    int32 level = 2;      // 当前AGV，在卡车装车任务中的高层。0 地面，1 卡车车厢内
    bool task_paused = 3; // 是否暂停当前 planning 正在执行的任务
}
